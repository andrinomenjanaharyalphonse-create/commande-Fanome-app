<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi FANOME - Multi-Photos & Logistique</title>
    <!-- Icône pour l'installation sur smartphone -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063067.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063067.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .photo-card { position: relative; transition: all 0.2s; }
        .photo-card:hover .delete-btn { opacity: 1; }
        @media print { .no-print { display: none; } }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="font-bold text-blue-800" id="loaderText">Traitement en cours...</p>
    </div>

    <!-- Header -->
    <header class="max-w-4xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-3 rounded-lg text-white font-bold text-xl shadow-inner">F</div>
            <div>
                <h1 class="text-xl font-bold uppercase tracking-tight">FANOME Photo-Suivi</h1>
                <p class="text-slate-500 text-xs italic">Plateforme Logistique APF</p>
            </div>
        </div>
        <div class="text-right mt-4 md:mt-0">
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest border border-blue-200">District ↔ CSB</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- SECTION 0 : IDENTIFICATION -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2 uppercase tracking-wider">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Identification de l'Agent
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nom de l'APF</label>
                    <input type="text" id="apfName" placeholder="Prénom et Nom" class="w-full text-sm p-3 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">CSB d'affectation</label>
                    <input type="text" id="csbName" placeholder="Ex: CSB II Mahavelona" class="w-full text-sm p-3 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
            </div>
        </div>
        
        <!-- SECTION 1 : PHOTOS -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2 uppercase tracking-wider">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Photos du Bon de Commande
                </h3>
                <span id="pageCount" class="text-[10px] bg-blue-600 px-2 py-1 rounded font-bold text-white uppercase shadow-sm">0 Page</span>
            </div>
            
            <div id="photoGallery" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4"></div>

            <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-8 bg-slate-50 hover:bg-blue-50 hover:border-blue-300 transition-all cursor-pointer relative group" id="addBtnContainer">
                <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 cursor-pointer" onchange="processAndAddPhoto(event)">
                <div class="text-center group-hover:scale-110 transition-transform">
                    <div class="text-blue-500 mb-2">
                        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                    <p class="text-xs font-bold text-slate-600">PRENDRE LA PHOTO DE LA PAGE <span id="nextPageNum" class="text-blue-600">1</span></p>
                </div>
            </div>
        </div>

        <!-- SECTION 2 : LOGISTIQUE -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">Dates Clés & Suivi</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Date Commande (CSB)</label>
                        <input type="date" id="dateC" class="w-full p-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                   
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <label class="block text-[10px] font-bold text-blue-700 uppercase mb-1 italic">Notification SMS Envoyée</label>
                        <div class="flex gap-2 mt-1">
                            <input type="datetime-local" id="dateSMS" class="w-full p-2 border border-blue-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <button onclick="alerteSMS()" class="bg-blue-600 text-white px-4 rounded-lg font-bold hover:bg-blue-700 active:scale-95 transition-all text-xs shadow-sm">SMS</button>
                        </div>
                    </div>
                     <!-- NOUVEAU CHAMP : ENVOI INTRANTS -->
                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg shadow-inner">
                        <label class="block text-[10px] font-bold text-amber-700 uppercase mb-1">Date d'Envoi Intrants (Pha-Gdis → CSB)</label>
                        <input type="date" id="dateEnvoiGdis" class="w-full p-2 border border-amber-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">Transport & Coût</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Moyen utilisé</label>
                            <select id="moyen" class="w-full text-sm p-2.5 border border-slate-200 rounded-lg bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Moto">Moto</option>
                                <option value="Camion District">Camion District</option>
                                <option value="Taxi-Brousse">Taxi-Brousse</option>
                                <option value="Portage">Portage (À pied)</option>
                                <option value="Pirogue">Pirogue</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Frais de transport (Ariary)</label>
                            <input type="number" id="cout" placeholder="0 Ar" class="w-full text-sm p-2.5 border border-slate-200 rounded-lg bg-slate-50 font-bold text-blue-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button onclick="soumettre()" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-800 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        ENVOYER LES DONNÉES
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWz1Nojl7Cqg5f3pRYDrfYhhedRvvXx0dUwS0L32iCKcCV_gmKHzinw_MwM-xqVTcC/exec";

        let photosArray = [];

        async function processAndAddPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loaderText').textContent = "Compression de l'image...";

            try {
                const compressedBase64 = await compressImage(file);
                photosArray.push(compressedBase64);
                renderGallery();
            } catch (error) {
                console.error("Erreur de compression:", error);
                alert("Erreur lors du traitement de l'image.");
            } finally {
                document.getElementById('loader').style.display = 'none';
                event.target.value = "";
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 1000;
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        function removePhoto(index) {
            photosArray.splice(index, 1);
            renderGallery();
        }

        function renderGallery() {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = "";
            photosArray.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = "photo-card rounded-lg overflow-hidden border border-slate-200 h-40 relative bg-white shadow-sm ring-1 ring-slate-100";
                div.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover">
                    <div class="absolute top-0 left-0 bg-blue-600 text-white px-2 py-1 text-[10px] font-bold">PAGE ${index+1}</div>
                    <button onclick="removePhoto(${index})" class="delete-btn absolute top-1 right-1 bg-red-500 text-white w-7 h-7 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-all">✕</button>
                `;
                gallery.appendChild(div);
            });
            document.getElementById('pageCount').textContent = photosArray.length + " Page(s)";
            document.getElementById('nextPageNum').textContent = photosArray.length + 1;
        }

        function alerteSMS() {
            const date = document.getElementById('dateSMS').value;
            const apf = document.getElementById('apfName').value || "un APF";
            if (!date) {
                alert("⚠️ Saisissez d'abord la date et l'heure du SMS.");
                return;
            }
            const formattedDate = date.replace('T', ' à ');
            alert(`📱 RAPPORT SMS :\n\n"Le bon de commande (${photosArray.length} pages) du CSB a été transmis par l'APF ${apf} le ${formattedDate}."`);
        }

        async function soumettre() {
            const apf = document.getElementById('apfName').value;
            const csb = document.getElementById('csbName').value;
            const dateGdis = document.getElementById('dateEnvoiGdis').value;

            if (!apf || !csb) {
                alert("⚠️ Erreur : L'APF et le CSB sont obligatoires.");
                return;
            }

            if (!dateGdis) {
                alert("⚠️ Attention : La date d'envoi Pha-Gdis n'est pas renseignée.");
                // Optionnel : On peut bloquer ou simplement avertir.
            }

            if (photosArray.length === 0) {
                alert("⚠️ Erreur : Prenez au moins une photo du bon.");
                return;
            }

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loaderText').textContent = "Synchronisation Cloud...";

            const data = {
                apfName: apf,
                csbName: csb,
                dateCommande: document.getElementById('dateC').value,
                dateEnvoiGdis: dateGdis,
                smsDate: document.getElementById('dateSMS').value,
                moyen: document.getElementById('moyen').value,
                cout: document.getElementById('cout').value || 0,
                photosCount: photosArray.length,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    cache: "no-cache",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                alert("✅ SYNC RÉUSSIE !\n\nDonnées envoyées (incluant l'envoi Pha-Gdis).");
            } catch (error) {
                console.error(error);
                alert("❌ ERREUR RÉSEAU.");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
