<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi FANOME - Multi-Photos & Logistique</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063067.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063067.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .photo-card { position: relative; transition: all 0.2s; }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="font-bold text-blue-800" id="loaderText">Traitement en cours...</p>
    </div>

    <!-- Header -->
    <header class="max-w-4xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-3 rounded-lg text-white font-bold text-xl shadow-inner">F</div>
            <div>
                <h1 class="text-xl font-bold uppercase tracking-tight">FANOME Photo-Suivi</h1>
                <p class="text-slate-500 text-xs italic">Plateforme Logistique APF</p>
            </div>
        </div>
        <div class="text-right mt-4 md:mt-0">
            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest border border-blue-200">District ↔ CSB</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- Identification -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2 uppercase tracking-wider">Identification de l'Agent</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nom de l'APF</label>
                    <input type="text" id="apfName" class="w-full text-sm p-3 border border-slate-200 rounded-lg bg-slate-50">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">CSB d'affectation</label>
                    <input type="text" id="csbName" class="w-full text-sm p-3 border border-slate-200 rounded-lg bg-slate-50">
                </div>
            </div>
        </div>
        
        <!-- Photos -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Bon de Commande (Photos)</h3>
                <span id="pageCount" class="text-[10px] bg-blue-600 px-2 py-1 rounded font-bold text-white">0 Page</span>
            </div>
            <div id="photoGallery" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4"></div>
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-8 bg-slate-50 cursor-pointer relative" id="addBtnContainer">
                <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 cursor-pointer" onchange="processAndAddPhoto(event)">
                <div class="text-center">
                    <p class="text-xs font-bold text-slate-600">AJOUTER UNE PAGE (<span id="nextPageNum">1</span>)</p>
                </div>
            </div>
        </div>

        <!-- Logistique -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">Dates de Traçabilité</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Date Commande (CSB)</label>
                        <input type="date" id="dateC" class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <label class="block text-[10px] font-bold text-blue-700 uppercase mb-1">SMS au Chef d'équipe</label>
                        <div class="flex gap-2">
                            <input type="datetime-local" id="dateSMS" class="w-full p-2 border border-blue-200 rounded-lg text-sm bg-white">
                            <button onclick="alerteSMS()" class="bg-blue-600 text-white px-4 rounded-lg font-bold text-xs">SMS</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Envoi District via CSB</label>
                        <input type="date" id="dateEnvoiGdis" class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">Transport</h3>
                    <div class="space-y-4">
                        <select id="moyen" class="w-full text-sm p-2.5 border border-slate-200 rounded-lg bg-slate-50">
                            <option value="Moto">Moto</option>
                            <option value="Camion District">Camion District</option>
                            <option value="Taxi-Brousse">Taxi-Brousse</option>
                            <option value="Portage">Portage</option>
                        </select>
                        <input type="number" id="cout" placeholder="Coût (AR)" class="w-full text-sm p-2.5 border border-slate-200 rounded-lg bg-slate-50 font-bold text-blue-800">
                    </div>
                </div>
                <button onclick="soumettre()" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold shadow-lg mt-6">
                    ENREGISTRER SUR LE CLOUD
                </button>
            </div>
        </div>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWz1Nojl7Cqg5f3pRYDrfYhhedRvvXx0dUwS0L32iCKcCV_gmKHzinw_MwM-xqVTcC/exec";
        let photosArray = [];

        async function processAndAddPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('loader').style.display = 'flex';
            try {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 1000;
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        photosArray.push(canvas.toDataURL('image/jpeg', 0.7));
                        renderGallery();
                        document.getElementById('loader').style.display = 'none';
                    };
                };
            } catch (e) { document.getElementById('loader').style.display = 'none'; }
        }

        function renderGallery() {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = "";
            photosArray.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = "photo-card rounded-lg overflow-hidden border border-slate-200 h-40 relative bg-white shadow-sm";
                div.innerHTML = `<img src="${src}" class="w-full h-full object-cover"><button onclick="photosArray.splice(${index},1);renderGallery()" class="absolute top-1 right-1 bg-red-500 text-white w-7 h-7 rounded-full">✕</button>`;
                gallery.appendChild(div);
            });
            document.getElementById('pageCount').textContent = photosArray.length + " Page(s)";
            document.getElementById('nextPageNum').textContent = photosArray.length + 1;
        }

        function alerteSMS() {
            const date = document.getElementById('dateSMS').value;
            if (!date) { alert("Veuillez saisir la date du SMS."); return; }
            alert(`📱 SMS AU CHEF D'ÉQUIPE :\n\n"Bon de commande FANOME (${photosArray.length} pages) transmis le ${date.replace('T', ' à ')}."`);
        }

        async function soumettre() {
            const apf = document.getElementById('apfName').value;
            const csb = document.getElementById('csbName').value;
            if (!apf || !csb || photosArray.length === 0) { alert("Complétez l'identification et les photos."); return; }
            document.getElementById('loader').style.display = 'flex';
            const data = { apfName: apf, csbName: csb, photosCount: photosArray.length };
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                alert("✅ SYNC RÉUSSIE !");
            } catch (e) { alert("Erreur réseau"); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }
    </script>
</body>
</html>
